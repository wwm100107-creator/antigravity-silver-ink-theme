<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="iaBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="iaRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="iaStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="64" fill="url(#iaBg)"/>
  <circle cx="64" cy="64" r="58" stroke="url(#iaRing)" stroke-width="2.4" opacity="0.88"/>
  <circle cx="64" cy="64" r="51" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>
  <!-- Swirling black & silver ink tendrils -->
  <path d="M 18 74 C 34 34, 80 26, 108 54" stroke="#cbd5e1" stroke-width="2.6" stroke-linecap="round" opacity="0.5"/>
  <path d="M 22 86 C 48 106, 90 96, 106 62" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <!-- Central Celestial 4-Pointed Starlight Crest (matching the character's starlight pupil) -->
  <path d="M 64 20 L 72 52 L 104 64 L 72 76 L 64 108 L 56 76 L 24 64 L 56 52 Z" fill="url(#iaStar)">
    <animate attributeName="opacity" values="0.82;1;0.82" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <circle cx="64" cy="64" r="8" fill="#090d16"/>
  <circle cx="64" cy="64" r="4" fill="#ffffff"/>
  <!-- Corner starlight motes -->
  <path d="M 34 36 L 35.5 40.5 L 40 42 L 35.5 43.5 L 34 48 L 32.5 43.5 L 28 42 L 32.5 40.5 Z" fill="#f8fafc"/>
  <path d="M 94 80 L 95.5 84.5 L 100 86 L 95.5 87.5 L 94 92 L 92.5 87.5 L 88 86 L 92.5 84.5 Z" fill="#e2e8f0"/>
</svg>
