<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 38" fill="none">
  <defs>
    <linearGradient id="geWindArc" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.12"/>
      <stop offset="35%" stop-color="#2dd4bf" stop-opacity="0.88"/>
      <stop offset="72%" stop-color="#34d399" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="geLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
